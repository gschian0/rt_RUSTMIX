[package]
name = "rtmix-gfx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Gaussian splat tile rasterizer, PLY/SPZ loading, and 4D slice"

[features]
default = ["gpu"]
gpu = ["dep:wgpu"]

[dependencies]
libm = "0.2"
flate2 = "1"
wgpu = { version = "24", optional = true, features = ["spirv"] }

[dev-dependencies]
naga = { version = "24", features = ["wgsl-in"] }
