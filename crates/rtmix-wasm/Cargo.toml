[package]
name = "rtmix-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wasm32 WebAudio worklet bindings over core, spat, and minc"

[features]
default = []
webgpu = ["rtmix-gfx/gpu"]

[dependencies]
rtmix-core = { path = "../rtmix-core" }
rtmix-dsp = { path = "../rtmix-dsp" }
rtmix-spat = { path = "../rtmix-spat" }
rtmix-minc = { path = "../rtmix-minc" }
rtmix-gfx = { path = "../rtmix-gfx", optional = true, default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[lib]
crate-type = ["rlib"]
